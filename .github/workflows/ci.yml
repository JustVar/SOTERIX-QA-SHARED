name: ci

# Two repos WILL install this package and run their whole test suite through
# it, at migration steps 5 and 6. Neither does yet: the UI repo has the
# shims only on a rehearsal branch and the API repo does not reference the
# package at all. When they do, a quiet defect here is a quiet defect
# everywhere, which is what every job below is for. Each guards a failure
# mode that was reproduced, not imagined. See docs/RULES.md.
#
# Nothing here needs a credential. The tests are offline by construction:
# no network, no browser, no QA Touch key.
#
# No tag trigger. A release tag points at a commit main already gated, so the tag run
# repeated the same work: 4 releases in 1 day meant 4 wasted runs against the Actions
# allowance (09/22/2026). Release from a green main, and tag that commit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 06:20 UTC: the full interpreter matrix, which a push no longer runs.
    - cron: '20 6 * * 0'
  workflow_dispatch:
    inputs:
      hosted:
        description: "Run on GitHub's runners instead of spartan1 (use when the box is down)"
        type: boolean
        default: false

# spartan1 runs these jobs and costs no Actions minutes. The fallback is the dispatch input
# above: if the box is off, run this workflow by hand with `hosted` ticked. The runner there is
# ghrunner, which cannot read the nightly's .env and cannot write the published archive.

# Every job here checks out and runs tests. Nothing writes to the repo, so
# nothing needs more than read. The sibling repo's qa-nightly.yml already
# scopes its token this way; these should not be looser than the file they
# sit beside.
permissions:
  contents: read

jobs:
  # The interpreter range is a claim until something exercises it.
  # pyproject says >=3.11; the API repo's gate runs 3.12 and UI dev runs
  # 3.14. Before this matrix, only 3.14 was ever run.
  #
  # 1 version on a push, all 4 on the weekly run or by hand. GitHub bills each
  # JOB rounded up to a whole minute, so these 4 jobs of 16 to 28 seconds cost
  # 4 minutes of the allowance for about 90 seconds of work. At 90 percent of a
  # 2000 minute month (09/22/2026) that is the largest saving available here.
  test:
    runs-on: ${{ github.event.inputs.hosted == 'true' && 'ubuntu-latest' || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'push' && fromJSON('["3.14"]')) || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check .
      - name: Prose
        run: python tools/prose_check.py

  # Rule 9. An editable install's .pth masks a missing package-data file,
  # so the only honest check installs the BUILT WHEEL. The base install is
  # client-only on purpose: importing the reporter must fail here naming
  # pytest, which is what rule 2's exc.name check depends on.
  #
  # Every step below runs inside a venv this job makes, not the interpreter
  # setup-python hands over. On a runner that keeps its tool cache between
  # jobs, pytest was already there from the test job, "a base install" was not
  # base, and the extras check passed nothing (first self-hosted run on
  # spartan1, 09/22/2026). A venv makes the check mean the same on any runner.
  wheel:
    runs-on: ${{ github.event.inputs.hosted == 'true' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A venv of its own, so a base install is really base
        run: |
          python -m venv .wheelvenv
          echo "$PWD/.wheelvenv/bin" >> "$GITHUB_PATH"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel alone, base extras only
        run: |
          pip install dist/*.whl
          python -c "import importlib.util as u, sys; sys.exit('pytest is present, so this is not a base install') if u.find_spec('pytest') else print('base install confirmed: no pytest')"
      - name: Every module a base install must import
        run: |
          python - <<'PY'
          import importlib
          for m in [
              "soterix_qa_shared",
              "soterix_qa_shared.qatouch",
              "soterix_qa_shared.qatouch.client",
              "soterix_qa_shared.qatouch.mapping",
              "soterix_qa_shared.qatouch.artifacts",
              "soterix_qa_shared.qatouch.layout",
              "soterix_qa_shared.qatouch.results",
              "soterix_qa_shared.qatouch.upload",
              "soterix_qa_shared.qatouch.retry",
              "soterix_qa_shared.reporting",
              "soterix_qa_shared.reporting.paths",
              "soterix_qa_shared.reporting.products",
              "soterix_qa_shared.reporting.branding",
              "soterix_qa_shared.reporting.layout",
              "soterix_qa_shared.reporting.email",
              "soterix_qa_shared.reporting.run_report",
              "soterix_qa_shared.jira",
              "soterix_qa_shared.jira.client",
              "soterix_qa_shared.jira.fields",
          ]:
              importlib.import_module(m)
              print("ok", m)
          PY
      - name: py.typed ships with the wheel
        run: |
          python -c "import importlib.util,pathlib,sys; p=pathlib.Path(importlib.util.find_spec('soterix_qa_shared').origin).parent/'py.typed'; sys.exit(0 if p.exists() else 'py.typed missing from the installed package')"
      - name: The reporter needs its extra, and says which one
        run: |
          python - <<'PY'
          import sys
          try:
              import soterix_qa_shared.qatouch.reporter          # noqa: F401
          except ModuleNotFoundError as exc:
              root = (exc.name or "").split(".")[0]
              assert root == "pytest", f"expected pytest to be missing, got {exc.name}"
              print("ok: base install reports the missing extra as", exc.name)
              sys.exit(0)
          sys.exit("the reporter imported without pytest, so the extras split is not real")
          PY
      - name: With the extra, it imports
        run: |
          pip install "$(ls dist/*.whl)[reporter]"
          python -c "import soterix_qa_shared.qatouch.reporter; print('ok')"

  # Rule 4. With [project] version unchanged, `pip install -r requirements`
  # against a new tag pin is a silent exit-0 no-op that leaves the old code
  # installed. -U does not rescue it. A tag that does not match the version
  # is therefore a tag that consumers cannot pin to.
  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ github.event.inputs.hosted == 'true' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must equal [project] version
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not m:
              sys.exit("no [project] version found in pyproject.toml")
          version = m.group(1)
          # removeprefix, not lstrip: lstrip takes a character SET, so
          # it accepts "vv0.12.0" and "vvvvv0.12.0" as 0.12.0.
          if tag.removeprefix("v") != version:
              sys.exit(
                  f"tag {tag} does not match [project] version {version}.\n"
                  "A consumer pinning this tag would install the previous code, "
                  "silently, with exit 0."
              )
          print(f"ok: tag {tag} matches version {version}")
          PY
