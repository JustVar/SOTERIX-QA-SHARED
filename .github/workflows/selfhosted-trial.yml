# A trial of the runner on spartan1. It runs nowhere else and costs no GitHub minutes.
# Delete this file once the real gates run self-hosted.
name: selfhosted-trial

on:
  push:
    branches: ["runner-trial"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: [self-hosted, linux, spartan1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Say where this ran
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          python -V
      - name: The isolation this runner must keep
        run: |
          test ! -r /data/qa/ci/Soterix-WebApp-QA/.env && echo "the nightly .env is not readable: correct"
          test ! -w /data/qa/runs && echo "the served archive is not writable: correct"
      - run: pip install -e ".[dev]" || pip install -e .
      - run: python -m pytest tests -p no:cacheprovider -q
