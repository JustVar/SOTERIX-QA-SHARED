[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soterix-qa-shared"
version = "0.38.0"
description = "Shared QA pipeline for the Soterix QA repos: QA Touch client, a pytest result reporter with pluggable sinks, and the reporting leaves both repos share."
requires-python = ">=3.11"
# Base install is client-only on purpose: a script that only reads QA Touch
# must not drag pytest in. The reporter extra adds it.
#
# RANGES, not exact pins. This is a library: two applications install it
# alongside their own dependency sets, and an exact pin here would force a
# conflict on any consumer that needs a different requests. The upper bound
# is the guard a bare name lacks - it stops a future major release from
# arriving unannounced through a routine install.
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Ranges again, for the same reason: a consumer pins its own pytest, and a
# library that disagrees is a library that cannot be installed. The floor is
# what the reporter's hooks need; the ceiling stops a major release landing
# through an unrelated install.
reporter = ["pytest>=8,<10"]
jira = ["jira>=3.10,<4"]
email = ["msal>=1.20,<2"]
# Exact, unlike the runtime deps above. Nothing installs this extra
# alongside another project's requirements, so there is no conflict to
# cause - and a lint tool that moves changes which findings appear, which
# is how a change passes on one machine and fails on another with no code
# difference. Measured 2026-08-28: the UI repo had ruff 0.16.1 and the API
# repo 0.16.2.
#
# Exact pins go stale. Dependabot bumps them as PRs that CI has to prove,
# which is what keeps "reproducible" from also meaning "frozen".
dev = ["pytest==9.1.1", "ruff==0.16.9", "pytest-html==4.2.0"]

[tool.setuptools.package-data]
soterix_qa_shared = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
